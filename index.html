        // Live Wikidata Property search input component
        function PropertySearchInput({ value, onChange }) {
          const [query, setQuery] = useState(value);
          const [results, setResults] = useState([]);
          const [open, setOpen] = useState(false);
          const ref = useRef(null);

          useEffect(() => {
            setQuery(value);
          }, [value]);

          useEffect(() => {
            const handleOutside = (e) => {
              if (ref.current && !ref.current.contains(e.target)) setOpen(false);
            };
            document.addEventListener('mousedown', handleOutside);
            return () => document.removeEventListener('mousedown', handleOutside);
          }, []);

          const handleSearch = async (val) => {
            setQuery(val);
            onChange(val);
            if (!val || val.trim().length < 2) {
              setResults([]);
              setOpen(false);
              return;
            }
            setOpen(true);
            try {
              const url = `https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(val.trim())}&language=en&limit=8&type=property&format=json&origin=*`;
              const res = await fetch(url);
              const data = await res.json();
              setResults(data.search || []);
            } catch (err) {
              setResults([]);
            }
          };

          return (
            <div className="relative w-44" ref={ref}>
              <input 
                type="text" 
                value={query} 
                onChange={(e) => handleSearch(e.target.value)} 
                onFocus={() => { if (results.length > 0) setOpen(true); }} 
                placeholder="Property (e.g. P248)" 
                className="w-full px-2 py-1 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 font-mono text-xs" 
              />
              {open && results.length > 0 && (
                <div className="absolute z-30 w-64 mt-1 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-md shadow-lg max-h-48 overflow-y-auto">
                  {results.map((p) => (
                    <div 
                      key={p.id} 
                      onClick={() => {
                        onChange(p.id);
                        setQuery(p.id);
                        setOpen(false);
                      }} 
                      className="px-3 py-1.5 hover:bg-indigo-50 dark:hover:bg-gray-700 cursor-pointer text-xs border-b border-gray-100 dark:border-gray-700 last:border-b-0"
                    >
                      <div className="font-semibold text-gray-900 dark:text-gray-100">{p.label} <span className="font-mono text-indigo-600 dark:text-indigo-400">({p.id})</span></div>
                      <div className="text-[10px] text-gray-500 truncate">{p.description}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        }

        // Reference row editor
        function ReferenceEditor({ field, labelName, active, references, onAdd, onRemove, onChange }) {
          if (!active) return null;
          const rows = references[field] || [];
          return (
            <div className="mt-2 p-3 bg-gray-50 dark:bg-gray-900/60 border border-indigo-100 dark:border-indigo-900/50 rounded-md text-xs space-y-2">
              <div className="flex justify-between items-center text-gray-600 dark:text-gray-300 font-semibold">
                <span>References for {labelName}:</span>
                <button 
                  type="button" 
                  onClick={() => onAdd(field)} 
                  className="text-indigo-600 dark:text-indigo-400 hover:underline text-xs flex items-center gap-1"
                >
                  + Add another reference field
                </button>
              </div>
              {rows.map((refItem, idx) => (
                <div key={idx} className="flex gap-2 items-center">
                  <PropertySearchInput 
                    value={refItem.prop} 
                    onChange={(newProp) => onChange(field, idx, 'prop', newProp)} 
                  />
                  <input 
                    type="text" 
                    value={refItem.val} 
                    onChange={(e) => onChange(field, idx, 'val', e.target.value)} 
                    placeholder="Value (e.g. QID, URL, or string)" 
                    className="flex-1 px-2 py-1 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 text-xs" 
                  />
                  {rows.length > 1 && (
                    <button 
                      type="button" 
                      onClick={() => onRemove(field, idx)} 
                      className="text-red-500 hover:text-red-700 px-1 font-bold"
                      title="Remove"
                    >
                      ✕
                    </button>
                  )}
                </div>
              ))}
            </div>
          );
        }

        function Bookitemizer() {
          const [mode, setMode] = useState('both');
          const [existingWorkQid, setExistingWorkQid] = useState('');
          const [isWorkVerified, setIsWorkVerified] = useState(false);
          const [workSearchQuery, setWorkSearchQuery] = useState('');
          const [workSearchResults, setWorkSearchResults] = useState([]);
          const [showWorkResults, setShowWorkResults] = useState(false);
          const [workLoading, setWorkLoading] = useState(false);
          const [workOffset, setWorkOffset] = useState(0);
          const [workHasMore, setWorkHasMore] = useState(true);

          const [detectedWork, setDetectedWork] = useState(null);
          const [detectingWork, setDetectingWork] = useState(false);

          // Name entries state
          const [names, setNames] = useState([
            { langCode: 'pa', value: '' }
          ]);
          const [openLangIndex, setOpenLangIndex] = useState(null);
          const [langSearch, setLangSearch] = useState('');
          const namesDropdownRef = useRef(null);

          const [formData, setFormData] = useState({
            authorName: '',

            editorName: '',
            editorQid: '',
            translatorName: '',
            translatorQid: '',
            publicationYear: '',
            publisherQid: '',
            placeOfPublicationQid: '',
            numberOfPages: '',
            wikisourceUrl: '',
            commonsFile: '',
            titlePageNumber: '',
            isbn: '',
            formOfCreativeWorkQid: '',
            formOfCreativeWorkName: '',
            genreQid: '',
            genreName: '',
            mainSubjectQid: '',
            mainSubjectName: '',
            customWorkDesc: '',
            customEditionDesc: '',
            punjabiScript: 'Q689894'
          });

          const [refToggles, setRefToggles] = useState({
            author: false,
            editor: false,
            translator: false,
            publisher: false,
            place: false,
            year: false
          });

          const [references, setReferences] = useState({
            author: [{ prop: '', val: '' }],
            editor: [{ prop: '', val: '' }],
            translator: [{ prop: '', val: '' }],
            publisher: [{ prop: '', val: '' }],
            place: [{ prop: '', val: '' }],
            year: [{ prop: '', val: '' }]
          });

          const [copied, setCopied] = useState(false);
          const [darkMode, setDarkMode] = useState(false);

          const [authorSearchQuery, setAuthorSearchQuery] = useState('');
          const [authorSearchResults, setAuthorSearchResults] = useState([]);
          const [showAuthorResults, setShowAuthorResults] = useState(false);
          const [authorLoading, setAuthorLoading] = useState(false);

          const [editorSearchQuery, setEditorSearchQuery] = useState('');
          const [editorSearchResults, setEditorSearchResults] = useState([]);
          const [showEditorResults, setShowEditorResults] = useState(false);
          const [editorLoading, setEditorLoading] = useState(false);

          const [translatorSearchQuery, setTranslatorSearchQuery] = useState('');
          const [translatorSearchResults, setTranslatorSearchResults] = useState([]);
          const [showTranslatorResults, setShowTranslatorResults] = useState(false);
          const [translatorLoading, setTranslatorLoading] = useState(false);

          const [publisherSearchQuery, setPublisherSearchQuery] = useState('');
          const [publisherSearchResults, setPublisherSearchResults] = useState([]);
          const [showPublisherResults, setShowPublisherResults] = useState(false);
          const [publisherLoading, setPublisherLoading] = useState(false);

          const [placeSearchQuery, setPlaceSearchQuery] = useState('');
          const [placeSearchResults, setPlaceSearchResults] = useState([]);
          const [showPlaceResults, setShowPlaceResults] = useState(false);
          const [placeLoading, setPlaceLoading] = useState(false);

          const [formSearchQuery, setFormSearchQuery] = useState('');
          const [formSearchResults, setFormSearchResults] = useState([]);
          const [showFormResults, setShowFormResults] = useState(false);
          const [formLoading, setFormLoading] = useState(false);

          const [genreSearchQuery, setGenreSearchQuery] = useState('');
          const [genreSearchResults, setGenreSearchResults] = useState([]);
          const [showGenreResults, setShowGenreResults] = useState(false);
          const [genreLoading, setGenreLoading] = useState(false);

          const [subjectSearchQuery, setSubjectSearchQuery] = useState('');
          const [subjectSearchResults, setSubjectSearchResults] = useState([]);
          const [showSubjectResults, setShowSubjectResults] = useState(false);
          const [subjectLoading, setSubjectLoading] = useState(false);

          const [commonsSearchQuery, setCommonsSearchQuery] = useState('');
          const [commonsSearchResults, setCommonsSearchResults] = useState([]);
          const [showCommonsResults, setShowCommonsResults] = useState(false);
          const [commonsLoading, setCommonsLoading] = useState(false);

          const workSearchRef = useRef(null);
          const workDropdownRef = useRef(null);
          const authorSearchRef = useRef(null);
          const editorSearchRef = useRef(null);
          const translatorSearchRef = useRef(null);
          const publisherSearchRef = useRef(null);
          const placeSearchRef = useRef(null);
          const formSearchRef = useRef(null);
          const genreSearchRef = useRef(null);
          const subjectSearchRef = useRef(null);
          const commonsSearchRef = useRef(null);

          useEffect(() => {
            const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            setDarkMode(isDark);
            if (isDark) document.documentElement.classList.add('dark');
          }, []);

          useEffect(() => {
            const handleClickOutside = (event) => {
              if (workSearchRef.current && !workSearchRef.current.contains(event.target)) setShowWorkResults(false);
              if (authorSearchRef.current && !authorSearchRef.current.contains(event.target)) setShowAuthorResults(false);
              if (editorSearchRef.current && !editorSearchRef.current.contains(event.target)) setShowEditorResults(false);
              if (translatorSearchRef.current && !translatorSearchRef.current.contains(event.target)) setShowTranslatorResults(false);
              if (publisherSearchRef.current && !publisherSearchRef.current.contains(event.target)) setShowPublisherResults(false);
              if (placeSearchRef.current && !placeSearchRef.current.contains(event.target)) setShowPlaceResults(false);
              if (formSearchRef.current && !formSearchRef.current.contains(event.target)) setShowFormResults(false);
              if (genreSearchRef.current && !genreSearchRef.current.contains(event.target)) setShowGenreResults(false);
              if (subjectSearchRef.current && !subjectSearchRef.current.contains(event.target)) setShowSubjectResults(false);
              if (commonsSearchRef.current && !commonsSearchRef.current.contains(event.target)) setShowCommonsResults(false);
              if (namesDropdownRef.current && !namesDropdownRef.current.contains(event.target)) setOpenLangIndex(null);
            };
            document.addEventListener('mousedown', handleClickOutside);
            return () => document.removeEventListener('mousedown', handleClickOutside);
          }, []);

          const toggleDarkMode = () => {
            setDarkMode(!darkMode);
            document.documentElement.classList.toggle('dark');
          };

          const handleNameChange = (index, value) => {
            setNames(prev => {
              const updated = [...prev];
              updated[index] = { ...updated[index], value };
              return updated;
            });
          };

          const handleNameLangChange = async (index, langCode) => {
            setNames(prev => {
              const updated = [...prev];
              updated[index] = { ...updated[index], langCode };
              return updated;
            });
            setOpenLangIndex(null);
            setLangSearch('');

            if (index === 0 && formData.authorQid) {
              const authorLabels = await fetchItemLabels(formData.authorQid, langCode);
              setFormData(prev => ({
                ...prev,
                authorName: authorLabels.local || ''
              }));
            }
          };

          const addNameRow = () => {
            const existingCodes = names.map(n => n.langCode);
            const defaultNext = existingCodes.includes('en') ? (existingCodes.includes('hi') ? 'bn' : 'hi') : 'en';
            setNames(prev => [...prev, { langCode: defaultNext, value: '' }]);
          };

          const removeNameRow = (index) => {
            setNames(prev => prev.filter((_, idx) => idx !== index));
          };

          const getLangDetails = (code) => {
            return FULL_LANGUAGE_LIST.find(l => l.code === code) || { code, name: code, qid: '' };
          };

          const toggleRef = (field) => {
            setRefToggles(prev => ({ ...prev, [field]: !prev[field] }));
          };

          const handleRefChange = (field, index, key, value) => {
            setReferences(prev => {
              const updated = [...prev[field]];
              updated[index] = { ...updated[index], [key]: value };
              return { ...prev, [field]: updated };
            });
          };

          const addRefRow = (field) => {
            setReferences(prev => ({
              ...prev,
              [field]: [...prev[field], { prop: '', val: '' }]
            }));
          };

          const removeRefRow = (field, index) => {
            setReferences(prev => {
              const updated = prev[field].filter((_, i) => i !== index);
              return { ...prev, [field]: updated.length > 0 ? updated : [{ prop: '', val: '' }] };
            });
          };

          const formatReferences = (field) => {
            if (!refToggles[field]) return '';
            const valid = (references[field] || []).filter(r => r.prop && r.prop.trim() && r.val && r.val.trim());
            if (valid.length === 0) return '';
            return valid.map(r => {
              const p = r.prop.trim().toUpperCase().replace(/^P/i, '');
              let v = r.val.trim();
              if (/^Q\d+$/i.test(v)) {
                return `|S${p}|${v.toUpperCase()}`;
              } else if (/^\+?\d{4}-\d{2}-\d{2}/.test(v)) {
                return `|S${p}|${v}`;
              } else {
                return `|S${p}|"${v.replace(/"/g, '\\"')}"`;
              }
            }).join('');
          };

          const fetchItemLabels = async (qid, langCode) => {
            if (!qid) return { en: '', local: '' };
            try {
              const response = await fetch(
                `https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${qid}&props=labels&languages=en|${langCode}&format=json&origin=*`
              );
              const data = await response.json();
              const entity = data.entities?.[qid];
              if (entity && entity.labels) {
                return {
                  en: entity.labels.en?.value || '',
                  local: entity.labels[langCode]?.value || ''
                };
              }
              return { en: '', local: '' };
            } catch (error) {
              return { en: '', local: '' };
            }
          };

          const verifyWorkSubclass = async (qid) => {
            if (!qid || !/^Q\d+$/i.test(qid)) return false;
            const sparql = `
              ASK {
                wd:${qid.toUpperCase()} wdt:P31 ?type .
                FILTER(?type IN (wd:Q47461344, wd:Q7725634, wd:Q3594128, wd:Q571, wd:Q17537576))
              }
            `;
            try {
              const response = await fetch(`https://query.wikidata.org/sparql?query=${encodeURIComponent(sparql)}&format=json`, {
                headers: { 'Accept': 'application/sparql-results+json' }
              });
              const data = await response.json();
              return data.boolean === true;
            } catch (err) {
              return false;
            }
          };

          // Reliable Duplicate Work Detection: searches by wbsearchentities & verifies P50 / author
          useEffect(() => {
            if (mode !== 'both') {
              setDetectedWork(null);
              return;
            }

            const authorQid = formData.authorQid ? formData.authorQid.trim().toUpperCase() : '';
            const authorName = formData.authorName ? formData.authorName.trim() : '';

            const titlesToQuery = names
              .map(n => ({ text: n.value.trim(), lang: n.langCode }))
              .filter(n => n.text.length >= 2);

            if (titlesToQuery.length === 0 || (!authorQid && !authorName)) {
              setDetectedWork(null);
              return;
            }

            const timer = setTimeout(async () => {
              setDetectingWork(true);

              for (const titleItem of titlesToQuery) {
                try {
                  const searchUrl = `https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(titleItem.text)}&language=${titleItem.lang}&limit=10&format=json&origin=*&type=item`;
                  const sResp = await fetch(searchUrl);
                  const sData = await sResp.json();
                  const candidateItems = sData.search || [];

                  if (candidateItems.length > 0) {
                    const candidateIds = candidateItems.map(c => c.id).join('|');
                    const entitiesUrl = `https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${candidateIds}&props=claims|labels|descriptions&format=json&origin=*`;
                    const eResp = await fetch(entitiesUrl);
                    const eData = await eResp.json();

                    const validWorkP31s = ['Q47461344', 'Q7725634', 'Q3594128', 'Q571', 'Q17537576'];

                    for (const cand of candidateItems) {
                      const entity = eData.entities?.[cand.id];
                      if (!entity) continue;

                      const p31Claims = (entity.claims?.P31 || []).map(c => c.mainsnak?.datavalue?.value?.id);
                      const isWork = p31Claims.some(id => validWorkP31s.includes(id));
                      if (!isWork) continue;

                      let matchesAuthor = false;
                      if (authorQid && entity.claims?.P50) {
                        matchesAuthor = entity.claims.P50.some(c => c.mainsnak?.datavalue?.value?.id?.toUpperCase() === authorQid);
                      }
                      if (!matchesAuthor && authorName) {
                        if (entity.claims?.P2093) {
                          matchesAuthor = entity.claims.P2093.some(c => (c.mainsnak?.datavalue?.value || '').toLowerCase() === authorName.toLowerCase());
                        }
                      }

                      if (matchesAuthor) {
                        setDetectedWork({
                          id: cand.id,
                          label: entity.labels?.[titleItem.lang]?.value || cand.label || cand.id,
                          description: entity.descriptions?.[titleItem.lang]?.value || cand.description || ''
                        });
                        setDetectingWork(false);
                        return;
                      }
                    }
                  }
                } catch (e) {
                  console.error('Work check error:', e);
                }
              }

              setDetectedWork(null);
              setDetectingWork(false);
            }, 500);

            return () => clearTimeout(timer);
          }, [names, formData.authorQid, formData.authorName, mode]);

          const searchWorks = async (query, offset = 0) => {
            const trimmed = query.trim();
            if (!trimmed || trimmed.length < 2) return [];

            if (/^Q\d+$/i.test(trimmed)) {
              try {
                const qid = trimmed.toUpperCase();
                const response = await fetch(
                  `https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${qid}&props=labels|descriptions&languages=en|pa|hi|ur|bn|ta|te|mr|gu|kn|ml|or|as|sa&format=json&origin=*`
                );
                const data = await response.json();
                const item = data.entities?.[qid];
                if (item && !item.missing) {
                  const label = item.labels?.en?.value || Object.values(item.labels || {})[0]?.value || qid;
                  const desc = item.descriptions?.en?.value || Object.values(item.descriptions || {})[0]?.value || 'No description available';
                  return [{ id: qid, label, description: desc }];
                }
              } catch (e) {}
            }

            try {
              const fallbackUrl = `https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(trimmed)}&language=en&limit=20&continue=${offset}&format=json&origin=*&type=item`;
              const fallbackResp = await fetch(fallbackUrl);
              const fallbackData = await fallbackResp.json();
              return (fallbackData.search || []).map(item => ({
                id: item.id,
                label: item.label,
                description: item.description || 'No description available'
              }));
            } catch (fallbackErr) {
              return [];
            }
          };

          const searchWikidataGeneral = async (query) => {
            if (!query || query.trim().length < 2) return [];
            try {
              const response = await fetch(
                `https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(query.trim())}&language=en&limit=15&format=json&origin=*&type=item`
              );
              const data = await response.json();
              return (data.search || []).map(item => ({
                id: item.id,
                label: item.label,
                description: item.description || 'No description available'
              }));
            } catch (error) {
              return [];
            }
          };

          const searchCommonsFiles = async (query) => {
            let cleanQuery = query.trim();
            cleanQuery = cleanQuery.replace(/^https?:\/\/commons\.wikimedia\.org\/wiki\/File:/i, '');
            cleanQuery = cleanQuery.replace(/^https?:\/\/commons\.wikimedia\.org\/wiki\//i, '');
            cleanQuery = cleanQuery.replace(/^File:/i, '');

            if (!cleanQuery || cleanQuery.length < 2) return [];

            const isAllowedExt = (name) => {
              const lower = (name || '').toLowerCase();
              return lower.endsWith('.pdf') || lower.endsWith('.djvu');
            };

            try {
              const prefixPromise = fetch(
                `https://commons.wikimedia.org/w/api.php?action=query&generator=prefixsearch&gpssearch=${encodeURIComponent(cleanQuery)}&gpsnamespace=6&gpslimit=20&prop=imageinfo&iiprop=url|thumburl&iiurlwidth=80&format=json&origin=*`
              );
              const cirrusSearchTerm = `intitle:"${cleanQuery}" filetype:pdf,djvu`;
              const cirrusPromise = fetch(
                `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(cirrusSearchTerm)}&gsrnamespace=6&gsrlimit=20&prop=imageinfo&iiprop=url|thumburl&iiurlwidth=80&format=json&origin=*`
              );

              const [prefixRes, cirrusRes] = await Promise.all([
                prefixPromise.then(r => r.json()).catch(() => ({})),
                cirrusPromise.then(r => r.json()).catch(() => ({}))
              ]);

              const resultMap = new Map();

              if (prefixRes.query && prefixRes.query.pages) {
                Object.values(prefixRes.query.pages).forEach(p => {
                  if (isAllowedExt(p.title)) {
                    const cleanTitle = p.title.replace(/^File:/i, '');
                    resultMap.set(cleanTitle, {
                      title: cleanTitle,
                      fullTitle: p.title,
                      thumb: p.imageinfo?.[0]?.thumburl || ''
                    });
                  }
                });
              }

              if (cirrusRes.query && cirrusRes.query.pages) {
                Object.values(cirrusRes.query.pages).forEach(p => {
                  if (isAllowedExt(p.title)) {
                    const cleanTitle = p.title.replace(/^File:/i, '');
                    if (!resultMap.has(cleanTitle)) {
                      resultMap.set(cleanTitle, {
                        title: cleanTitle,
                        fullTitle: p.title,
                        thumb: p.imageinfo?.[0]?.thumburl || ''
                      });
                    }
                  }
                });
              }

              const queryNorm = cleanQuery.toLowerCase().replace(/[\s_-]+/g, ' ');
              return Array.from(resultMap.values()).sort((a, b) => {
                const aNorm = a.title.toLowerCase().replace(/[\s_-]+/g, ' ');
                const bNorm = b.title.toLowerCase().replace(/[\s_-]+/g, ' ');
                if (aNorm.startsWith(queryNorm) && !bNorm.startsWith(queryNorm)) return -1;
                if (!aNorm.startsWith(queryNorm) && bNorm.startsWith(queryNorm)) return 1;
                return a.title.localeCompare(b.title);
              });
            } catch (err) {
              return [];
            }
          };

          const handleCommonsSearch = async (value) => {
            setCommonsSearchQuery(value);
            setShowCommonsResults(true);
            if (value.trim().length < 2) { setCommonsSearchResults([]); return; }
            setCommonsLoading(true);
            const results = await searchCommonsFiles(value);
            setCommonsSearchResults(results);
            setCommonsLoading(false);
          };

          const selectCommonsFile = (result) => {
            setFormData(prev => ({ ...prev, commonsFile: result.title }));
            setCommonsSearchQuery(result.title);
            setShowCommonsResults(false);
          };

          const clearCommonsFile = () => {
            setFormData(prev => ({ ...prev, commonsFile: '' }));
            setCommonsSearchQuery('');
            setCommonsSearchResults([]);
          };

          const handleWorkSearch = async (value) => {
            setWorkSearchQuery(value);
            setShowWorkResults(true);
            setWorkOffset(0);
            setWorkHasMore(true);
            if (value.length < 2) { setWorkSearchResults([]); return; }
            setWorkLoading(true);
            const results = await searchWorks(value, 0);
            setWorkSearchResults(results);
            setWorkLoading(false);
            if (results.length < 20) setWorkHasMore(false);
          };

          const loadMoreWorks = async () => {
            if (workLoading || !workHasMore || workSearchQuery.length < 2) return;
            setWorkLoading(true);
            const nextOffset = workOffset + 20;
            const moreResults = await searchWorks(workSearchQuery, nextOffset);
            if (moreResults.length === 0) {
              setWorkHasMore(false);
            } else {
              setWorkSearchResults(prev => [...prev, ...moreResults]);
              setWorkOffset(nextOffset);
              if (moreResults.length < 20) setWorkHasMore(false);
            }
            setWorkLoading(false);
          };

          const handleWorkScroll = (e) => {
            const { scrollTop, scrollHeight, clientHeight } = e.currentTarget;
            if (scrollHeight - scrollTop - clientHeight < 40) loadMoreWorks();
          };

          const selectWork = async (result) => {
            setExistingWorkQid(result.id);
            setWorkSearchQuery(result.label);
            setShowWorkResults(false);
            setWorkLoading(true);

            const verified = await verifyWorkSubclass(result.id);
            setIsWorkVerified(verified);

            try {
              const response = await fetch(
                `https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${result.id}&props=labels|claims&format=json&origin=*`
              );
              const data = await response.json();
              const entity = data.entities?.[result.id];

              if (entity) {
                const primaryLang = names[0]?.langCode || 'pa';
                const localLabel = entity.labels?.[primaryLang]?.value || '';

                if (localLabel) {
                  setNames(prev => {
                    const copy = [...prev];
                    copy[0] = { ...copy[0], value: localLabel };
                    return copy;
                  });
                }

                let authorQid = '';
                let authorNameLocal = '';

                if (entity.claims?.P50?.[0]?.mainsnak?.datavalue?.value?.id) {
                  authorQid = entity.claims.P50[0].mainsnak.datavalue.value.id;
                  const authorLabels = await fetchItemLabels(authorQid, primaryLang);
                  authorNameLocal = authorLabels.local || '';

                              <div className="absolute z-10 w-full mt-1 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-lg max-h-48 overflow-y-auto">
                                {genreSearchResults.map((result) => (
                                  <div key={result.id} onClick={() => selectGenre(result)} className="px-4 py-3 hover:bg-indigo-50 dark:hover:bg-gray-600 cursor-pointer border-b border-gray-200 dark:border-gray-600 last:border-b-0">
                                    <div className="font-medium text-gray-900 dark:text-gray-100">{result.label} <span className="text-sm text-gray-500 dark:text-gray-400">({result.id})</span></div>
                                    <div className="text-sm text-gray-600 dark:text-gray-400">{result.description}</div>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>

                          <div className="relative" ref={subjectSearchRef}>
                            <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Main subject (P921)</label>
                            <div className="relative">
                              <input 
                                type="text" 
                                value={formData.mainSubjectQid ? `${formData.mainSubjectQid} (${subjectSearchQuery})` : subjectSearchQuery} 
                                onChange={(e) => { if (!formData.mainSubjectQid) handleSubjectSearch(e.target.value); }} 
                                onFocus={() => { if (!formData.mainSubjectQid && subjectSearchQuery.length >= 2) setShowSubjectResults(true); }} 
                                className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 pr-10" 
                                placeholder="Search main subject (e.g. atheism, freedom of speech)..." 
                              />
                              {formData.mainSubjectQid && (
                                <button type="button" onClick={clearSubjectSearch} className="absolute right-2 top-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300" title="Clear selection">
                                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                                </button>
                              )}
                              {subjectLoading && (
                                <div className="absolute right-2 top-2">
                                  <svg className="animate-spin h-5 w-5 text-indigo-600" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                </div>
                              )}
                            </div>
                            {showSubjectResults && subjectSearchResults.length > 0 && (
                              <div className="absolute z-10 w-full mt-1 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-lg max-h-48 overflow-y-auto">
                                {subjectSearchResults.map((result) => (
                                  <div key={result.id} onClick={() => selectSubject(result)} className="px-4 py-3 hover:bg-indigo-50 dark:hover:bg-gray-600 cursor-pointer border-b border-gray-200 dark:border-gray-600 last:border-b-0">
                                    <div className="font-medium text-gray-900 dark:text-gray-100">{result.label} <span className="text-sm text-gray-500 dark:text-gray-400">({result.id})</span></div>
                                    <div className="text-sm text-gray-600 dark:text-gray-400">{result.description}</div>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        </div>
                      </div>
                    )}

                    <div className="pb-6">
                      <h3 className="text-lg font-semibold text-gray-800 dark:text-gray-200 mb-4">Publication Information</h3>
                      <div className="space-y-4">
                        <div className="relative" ref={publisherSearchRef}>
                          <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Publisher (P123)</label>
                          <div className="relative">
                            <input type="text" value={formData.publisherQid ? `${formData.publisherQid} (${publisherSearchQuery})` : publisherSearchQuery} onChange={(e) => { if (!formData.publisherQid) handlePublisherSearch(e.target.value); }} onFocus={() => { if (!formData.publisherQid && publisherSearchQuery.length >= 2) setShowPublisherResults(true); }} className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 pr-10" placeholder="Search for publisher..." />
                            {formData.publisherQid && (
                              <button type="button" onClick={clearPublisherSearch} className="absolute right-2 top-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300" title="Clear selection">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                              </button>
                            )}
                            {publisherLoading && (
                              <div className="absolute right-2 top-2">
                                <svg className="animate-spin h-5 w-5 text-indigo-600" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                              </div>
                            )}
                          </div>
                          {showPublisherResults && publisherSearchResults.length > 0 && (
                            <div className="absolute z-10 w-full mt-1 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-lg max-h-60 overflow-y-auto">
                              {publisherSearchResults.map((result) => (
                                <div key={result.id} onClick={() => selectPublisher(result)} className="px-4 py-3 hover:bg-indigo-50 dark:hover:bg-gray-600 cursor-pointer border-b border-gray-200 dark:border-gray-600 last:border-b-0">
                                  <div className="font-medium text-gray-900 dark:text-gray-100">{result.label} <span className="text-sm text-gray-500 dark:text-gray-400">({result.id})</span></div>
                                  <div className="text-sm text-gray-600 dark:text-gray-400">{result.description}</div>
                                </div>
                              ))}
                            </div>
                          )}
                          <div className="pt-1">
                            <label className="inline-flex items-center text-xs text-indigo-600 dark:text-indigo-400 cursor-pointer">
                              <input type="checkbox" checked={refToggles.publisher} onChange={() => toggleRef('publisher')} className="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 mr-2" />
                              Add reference source to Publisher statement
                            </label>
                            <ReferenceEditor 
                              field="publisher" 
                              labelName="Publisher" 
                              active={refToggles.publisher} 
                              references={references} 
                              onAdd={addRefRow} 
                              onRemove={removeRefRow} 
                              onChange={handleRefChange} 
                            />
                          </div>
                        </div>

                        <div className="relative" ref={placeSearchRef}>
                          <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Place of Publication (P291)</label>
                          <div className="relative">
                            <input type="text" value={formData.placeOfPublicationQid ? `${formData.placeOfPublicationQid} (${placeSearchQuery})` : placeSearchQuery} onChange={(e) => { if (!formData.placeOfPublicationQid) handlePlaceSearch(e.target.value); }} onFocus={() => { if (!formData.placeOfPublicationQid && placeSearchQuery.length >= 2) setShowPlaceResults(true); }} className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 pr-10" placeholder="Search for place..." />
                            {formData.placeOfPublicationQid && (
                              <button type="button" onClick={clearPlaceSearch} className="absolute right-2 top-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300" title="Clear selection">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                              </button>
                            )}
                            {placeLoading && (
                              <div className="absolute right-2 top-2">
                                <svg className="animate-spin h-5 w-5 text-indigo-600" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                              </div>
                            )}
                          </div>
                          {showPlaceResults && placeSearchResults.length > 0 && (
                            <div className="absolute z-10 w-full mt-1 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-lg max-h-60 overflow-y-auto">
                              {placeSearchResults.map((result) => (
                                <div key={result.id} onClick={() => selectPlace(result)} className="px-4 py-3 hover:bg-indigo-50 dark:hover:bg-gray-600 cursor-pointer border-b border-gray-200 dark:border-gray-600 last:border-b-0">
                                  <div className="font-medium text-gray-900 dark:text-gray-100">{result.label} <span className="text-sm text-gray-500 dark:text-gray-400">({result.id})</span></div>
                                  <div className="text-sm text-gray-600 dark:text-gray-400">{result.description}</div>
                                </div>
                              ))}
                            </div>
                          )}
                          <div className="pt-1">
                            <label className="inline-flex items-center text-xs text-indigo-600 dark:text-indigo-400 cursor-pointer">
                              <input type="checkbox" checked={refToggles.place} onChange={() => toggleRef('place')} className="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 mr-2" />
                              Add reference source to Place statement
                            </label>
                            <ReferenceEditor 
                              field="place" 
                              labelName="Place of Publication" 
                              active={refToggles.place} 
                              references={references} 
                              onAdd={addRefRow} 
                              onRemove={removeRefRow} 
                              onChange={handleRefChange} 
                            />
                          </div>
                        </div>

                        <div className="grid md:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Publication Year (P577)</label>
                            <input type="text" value={formData.publicationYear} onChange={handleYearChange} className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100" placeholder="e.g., 2024" maxLength="4" />
                            <div className="pt-1">
                              <label className="inline-flex items-center text-xs text-indigo-600 dark:text-indigo-400 cursor-pointer">
                                <input type="checkbox" checked={refToggles.year} onChange={() => toggleRef('year')} className="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 mr-2" />
                                Add reference source to Year statement
                              </label>
                              <ReferenceEditor 
                                field="year" 
                                labelName="Publication Year" 
                                active={refToggles.year} 
                                references={references} 
                                onAdd={addRefRow} 
                                onRemove={removeRefRow} 
                                onChange={handleRefChange} 
                              />
                            </div>
                          </div>
                          <div>
                            <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Number of Pages (P1104)</label>
                            <input type="text" value={formData.numberOfPages} onChange={handlePagesChange} className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100" placeholder="e.g., 256" />
                          </div>
                        </div>

                        <div>
                          <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">ISBN {isbnProperty && `(${isbnProperty === 'P957' ? 'ISBN-10' : 'ISBN-13'})`}</label>
                          <input type="text" value={formData.isbn} onChange={(e) => setFormData(prev => ({...prev, isbn: e.target.value}))} className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100" placeholder={isbnProperty === 'P957' ? 'e.g., 0-123-45678-9' : 'e.g., 978-0-123-45678-9'} />
                        </div>

                        <div>
                          <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Wikisource Index Page URL (P1957)</label>
                          <input type="url" value={formData.wikisourceUrl} onChange={handleWikisourceUrlChange} className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100" placeholder="e.g., https://wikisource.org/wiki/Index:Example.pdf" />
                        </div>
                        
                        <div className="grid md:grid-cols-3 gap-4 pt-2 border-t border-gray-100 dark:border-gray-700">
                          <div className="md:col-span-2 relative" ref={commonsSearchRef}>
                            <div className="flex justify-between items-center mb-1">
                              <label className="block text-sm font-medium text-gray-700 dark:text-gray-300">
                                Wikimedia Commons File (P996)
                              </label>
                              <span className="text-xs text-indigo-600 dark:text-indigo-400 font-medium">
                                Filtered: .pdf &amp; .djvu
                              </span>
                            </div>
                            <div className="relative">
                              <input 
                                type="text" 
                                value={formData.commonsFile ? formData.commonsFile : commonsSearchQuery} 
                                onChange={(e) => {
                                  if (!formData.commonsFile) handleCommonsSearch(e.target.value);
                                }} 
                                onFocus={() => {
                                  if (!formData.commonsFile && commonsSearchQuery.length >= 2) setShowCommonsResults(true);
                                }}
                                className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 pr-10" 
                                placeholder="Search .pdf or .djvu files on Wikimedia Commons..." 
                              />
                              {formData.commonsFile && (
                                <button
                                  type="button"
                                  onClick={clearCommonsFile}
                                  className="absolute right-2 top-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"
                                  title="Clear file"
                                >
                                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                                </button>
                              )}
                              {commonsLoading && (
                                <div className="absolute right-2 top-2">
                                  <svg className="animate-spin h-5 w-5 text-indigo-600" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                </div>
                              )}
                            </div>

                            {showCommonsResults && commonsSearchResults.length > 0 && (
                              <div className="absolute z-20 w-full mt-1 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-lg max-h-60 overflow-y-auto">
                                {commonsSearchResults.map((result, idx) => (
                                  <div
                                    key={idx}
                                    onClick={() => selectCommonsFile(result)}
                                    className="px-4 py-2 hover:bg-indigo-50 dark:hover:bg-gray-600 cursor-pointer border-b border-gray-200 dark:border-gray-600 last:border-b-0 flex items-center gap-3"
                                  >
                                    {result.thumb ? (
                                      <img src={result.thumb} alt="" className="w-10 h-10 object-cover rounded flex-shrink-0 bg-gray-100" />
                                    ) : (
                                      <div className="w-10 h-10 bg-gray-200 dark:bg-gray-600 rounded flex-shrink-0 flex items-center justify-center text-xs text-gray-500 font-mono">
                                        DOC
                                      </div>
                                    )}
                                    <div className="overflow-hidden">
                                      <div className="font-medium text-sm text-gray-900 dark:text-gray-100 truncate" title={result.title}>
                                        {result.title}
                                      </div>
                                      <div className="text-xs text-gray-500 dark:text-gray-400 font-mono">
                                        {result.title.toLowerCase().endsWith('.pdf') ? 'PDF Document' : 'DjVu Document'}
                                      </div>
                                    </div>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                          <div>
                            <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Title Page Number (P4714)</label>
                            <input 
                              type="text" 
                              value={formData.titlePageNumber} 
                              onChange={(e) => setFormData(prev => ({...prev, titlePageNumber: e.target.value}))} 
                              className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100" 
                              placeholder="e.g., 5" 
                            />
                            <p className="text-xs text-gray-500 dark:text-gray-400 mt-1">Qualifier for P996</p>
                          </div>
                        </div>

                      </div>
                    </div>
                  </div>
                </div>

                <div className="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-8 mb-6 transition-colors duration-200">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                    <h2 className="text-xl font-semibold text-gray-900 dark:text-gray-100">QuickStatements Output</h2>
                    <div className="flex flex-wrap gap-2">
                      <button onClick={handleCopy} disabled={!output} className="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed text-sm">
                        {copied ? 'Copied!' : 'Copy'}
                      </button>
                      <button onClick={handleOpenQuickStatements2} disabled={!output} className="flex items-center gap-2 px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed text-sm" title="Import via QuickStatements 2.0 (Magnus Toolforge)">
                        QuickStatements 2.0 ↗
                      </button>
                      <button onClick={handleOpenQuickStatements3} disabled={!output} className="flex items-center gap-2 px-4 py-2 bg-emerald-700 text-white rounded-md hover:bg-emerald-800 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed text-sm" title="Import via QuickStatements 3.0 (Wikimedia Brasil)">
                        QuickStatements 3.0 ↗
                      </button>
                    </div>
                  </div>
                  
                  <pre className="bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-md p-4 overflow-x-auto text-sm font-mono whitespace-pre-wrap min-h-[200px] text-gray-900 dark:text-gray-100 mb-6">
                    {output || (mode === 'edition_only' && !existingWorkQid 
                      ? 'Please search and select an existing Work item first...' 
                      : 'Fill in required fields (* marked) to generate QuickStatements...')}
                  </pre>

                  <div className="mt-4 text-sm text-gray-600 dark:text-gray-400 border-t border-gray-200 dark:border-gray-700 pt-6">
                    <div className="grid md:grid-cols-2 gap-8">
                      <div>
                        <h4 className="font-bold text-gray-800 dark:text-gray-200 mb-3">Auto-generated descriptions:</h4>
                        <ul className="space-y-2">
                          {mode === 'both' && (
                            <li><strong>Work:</strong> "work by {formData.authorName || '[author name]'}"</li>
                          )}
                          <li><strong>Edition:</strong> "{formData.publicationYear || '[year]'} edition of work by {formData.authorName || '[author name]'}"</li>
                        </ul>
                      </div>
                      <div>
                        <h4 className="font-bold text-gray-800 dark:text-gray-200 mb-3">Properties included:</h4>
                        <ul className="list-disc list-inside space-y-1">
                          <li>P31 = Instance of ({mode === 'both' ? 'Q7725634 work, ' : ''}Q3331189 edition)</li>
                          {mode === 'edition_only' && (
                            <li>
                              P629 = Edition or translation of {existingWorkQid ? `(${existingWorkQid})` : '(Requires Work QID)'}
                            </li>
                          )}
                          <li>P50 / P2093 = Author (with optional references)</li>
                          {mode === 'both' && (
                            <>
                              <li>P7937 = Form of creative work (work only, if provided)</li>
                              <li>P136 = Genre (work only, if provided)</li>
                              <li>P921 = Main subject (work only, if provided)</li>
                            </>
                          )}
                          <li>P98 = Editor (edition only, with optional references)</li>
                          <li>P655 = Translator (edition only, with optional references)</li>
                          <li>P123 = Publisher (edition only, with optional references)</li>
                          <li>P291 = Place of publication (edition only, with optional references)</li>
                          <li>P407 = Language (with P282 for Punjabi script)</li>
                          <li>P577 = Publication date (edition only, with optional references)</li>
                          <li>P957/P212 = ISBN-10/13 (based on year)</li>
                          <li>P1104 = Number of pages (edition only, optional)</li>
                          <li>P1476 = Title (primary name in specified language)</li>
                          <li>P1957 = Wikisource index URL (edition only, optional)</li>
                          <li>P996 = Wikimedia Commons file (with optional P4714 title page number)</li>
                        </ul>
                      </div>
                    </div>
                  </div>
                </div>

                <footer className="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 text-center transition-colors duration-200">
                  <div className="flex flex-col sm:flex-row items-center justify-center gap-4 text-sm text-gray-600 dark:text-gray-400">
                    <div className="flex items-center gap-2">
                      <span>Made with</span>
                      <svg className="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clipRule="evenodd" /></svg>
                      <span>by</span>
                      <a href="https://meta.wikimedia.org/wiki/User:Kuldeepburjbhalaike" target="_blank" className="text-indigo-600 dark:text-indigo-400 font-medium">Kuldeep</a>
                    </div>
                    <span className="hidden sm:inline text-gray-400 dark:text-gray-600">|</span>
                    <a href="https://gitlab.wikimedia.org/toolforge-repos/bookitemizer" target="_blank" className="text-indigo-600 dark:text-indigo-400">Source Code</a>
                  </div>
                </footer>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Bookitemizer />);
    </script>
</body>
</html>
